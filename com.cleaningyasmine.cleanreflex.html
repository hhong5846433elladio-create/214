<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MARJPMPRO</title>
  <!-- Global builds of required libraries -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ===== CSS Variables – Flat Design (Style #1) ===== */
    :root {
      --color-bg: #f5f7fa;
      --color-surface: #ffffff;
      --color-primary: #2563eb;
      --color-primary-light: #dbeafe;
      --color-text: #1e293b;
      --color-text-secondary: #64748b;
      --color-border: #e2e8f0;
      --color-up: #ef4444;      /* warm for gain */
      --color-down: #3b82f6;    /* cool for loss */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
      --font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --tab-bar-height: 56px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .page {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(var(--tab-bar-height) + var(--safe-bottom) + var(--spacing-md));
    }

    /* Tab bar visible only for main pages – controlled by route meta */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--tab-bar-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 100;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 64px;
      min-height: 44px;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary);
      text-decoration: none;
      transition: color 0.2s;
      gap: 2px;
    }

    .tab-item.router-link-active {
      color: var(--color-primary);
    }

    .tab-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Common UI */
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-md);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 var(--spacing-lg);
      border-radius: var(--radius-sm);
      border: none;
      background: var(--color-primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      touch-action: manipulation;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-outline {
      background: transparent;
      color: var(--color-primary);
      border: 1.5px solid var(--color-primary);
    }

    .input {
      width: 100%;
      min-height: 44px;
      padding: var(--spacing-sm) var(--spacing-md);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 16px;
      background: var(--color-surface);
      color: var(--color-text);
      outline: none;
      transition: border-color 0.2s;
    }

    .input:focus {
      border-color: var(--color-primary);
    }

    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-xs);
    }

    .page-header {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .page-header h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .back-btn {
      background: none;
      border: none;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-primary);
    }

    /* ===== Loading ===== */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--color-surface);
      z-index: 999;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: var(--spacing-md);
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    /* ===== Home ===== */
    .home-header {
      padding: var(--spacing-lg) var(--spacing-md);
      background: linear-gradient(135deg, var(--color-primary) 0%, #1e40af 100%);
      color: #fff;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      margin-bottom: var(--spacing-md);
    }

    .home-header .brand {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .home-header .tagline {
      font-size: 14px;
      opacity: 0.85;
      margin-top: var(--spacing-xs);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--spacing-sm);
      padding: 0 var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .quick-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-xs);
      padding: var(--spacing-sm) var(--spacing-xs);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.15s;
      text-decoration: none;
      color: var(--color-text);
      min-height: 80px;
    }

    .quick-action:active {
      transform: scale(0.96);
    }

    .quick-action svg {
      width: 28px;
      height: 28px;
      stroke: var(--color-primary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .quick-action span {
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
      color: var(--color-text-secondary);
    }

    .stock-list {
      padding: 0 var(--spacing-md);
    }

    .stock-list h2 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: var(--spacing-sm);
    }

    .stock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      transition: background 0.15s;
      min-height: 64px;
    }

    .stock-row:first-child {
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }

    .stock-row:last-child {
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      border-bottom: none;
    }

    .stock-row:active {
      background: var(--color-primary-light);
    }

    .stock-symbol {
      font-weight: 700;
      font-size: 15px;
    }

    .stock-name {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    .stock-price {
      font-weight: 600;
      font-size: 15px;
      text-align: right;
    }

    .stock-change {
      font-size: 13px;
      font-weight: 600;
      text-align: right;
      margin-top: 2px;
    }

    .change-up { color: var(--color-up); }
    .change-down { color: var(--color-down); }

    .stock-list-wrapper {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    /* ===== Stock Detail ===== */
    .stock-detail {
      padding: var(--spacing-md);
    }

    .detail-price {
      font-size: 36px;
      font-weight: 800;
      margin: var(--spacing-sm) 0;
    }

    .chart-container {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      padding: var(--spacing-sm);
      margin-top: var(--spacing-md);
    }

    /* ===== Toolbox ===== */
    .toolbox-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-md);
      padding: var(--spacing-md);
    }

    .tool-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.15s;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      min-height: 120px;
      text-decoration: none;
      color: var(--color-text);
    }

    .tool-card:active {
      transform: scale(0.97);
    }

    .tool-card svg {
      width: 32px;
      height: 32px;
      stroke: var(--color-primary);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-card .tool-title {
      font-weight: 700;
      font-size: 15px;
    }

    .tool-card .tool-desc {
      font-size: 12px;
      color: var(--color-text-secondary);
      line-height: 1.4;
    }

    /* ===== Settings ===== */
    .settings-list {
      padding: var(--spacing-md);
    }

    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
      min-height: 52px;
      transition: background 0.15s;
      text-decoration: none;
      color: var(--color-text);
    }

    .settings-item:first-child {
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }

    .settings-item:last-child {
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      border-bottom: none;
    }

    .settings-item:active {
      background: var(--color-primary-light);
    }

    .settings-item .label-text {
      font-size: 15px;
      font-weight: 500;
    }

    .settings-item .arrow {
      color: var(--color-text-secondary);
      font-size: 18px;
    }

    .settings-group {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--spacing-md);
    }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: var(--spacing-lg);
    }

    .modal-content {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      max-width: 400px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-content h2 {
      font-size: 18px;
      margin-bottom: var(--spacing-md);
    }

    .modal-content p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-text-secondary);
    }

    .modal-close {
      margin-top: var(--spacing-lg);
      width: 100%;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-bar-height) + var(--safe-bottom) + var(--spacing-lg));
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-text);
      color: #fff;
      padding: var(--spacing-sm) var(--spacing-lg);
      border-radius: 20px;
      font-size: 14px;
      z-index: 300;
      white-space: nowrap;
      animation: fadeInOut 2s ease forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ===== Page transition ===== */
    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.2s ease;
    }
    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }

    /* ===== Calendar ===== */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
      margin-top: var(--spacing-sm);
    }

    .calendar-cell {
      padding: var(--spacing-sm) 0;
      font-size: 13px;
      border-radius: var(--radius-sm);
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-cell.checked {
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
    }

    .calendar-cell.today {
      border: 2px solid var(--color-primary);
    }

    .calendar-header {
      font-weight: 600;
      font-size: 12px;
      color: var(--color-text-secondary);
      padding: var(--spacing-xs) 0;
    }

    .weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }

    .weekday-row span {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-secondary);
      padding: var(--spacing-xs) 0;
    }

    /* ===== Tools misc ===== */
    .tool-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
      padding: var(--spacing-md);
    }

    .result-box {
      background: var(--color-primary-light);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      margin-top: var(--spacing-md);
    }

    .result-box .result-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-secondary);
    }

    .result-box .result-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--color-primary);
      margin-top: var(--spacing-xs);
    }

    .md5-box {
      word-break: break-all;
      font-family: monospace;
      font-size: 12px;
      background: var(--color-bg);
      padding: var(--spacing-sm);
      border-radius: var(--radius-sm);
      margin-top: var(--spacing-sm);
      color: var(--color-text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: var(--spacing-xl) var(--spacing-md);
      color: var(--color-text-secondary);
      font-size: 14px;
    }

    .article-content {
      padding: var(--spacing-md);
      line-height: 1.8;
      font-size: 15px;
    }

    .article-content h2 {
      font-size: 20px;
      margin-bottom: var(--spacing-md);
    }

    .article-content p {
      margin-bottom: var(--spacing-md);
      color: var(--color-text-secondary);
    }

    /* Responsive tweaks */
    @media (min-width: 600px) {
      .stock-list, .toolbox-grid, .settings-list, .quick-actions {
        max-width: 560px;
        margin-left: auto;
        margin-right: auto;
      }
      .home-header {
        max-width: 560px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ============================================================
    // HOW TO ADD A NEW PAGE:
    // 1. Create a new component (e.g., const MyPage = { template: `...` })
    // 2. Add a route in the routes array with path, component, and meta
    // 3. If it should be a main tab, add meta: { showTab: true } and
    //    include it in the tab bar template
    // 4. If it should NOT show the tab bar, set meta: { showTab: false }
    //    (default is false)
    // ============================================================

    const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick } = Vue;
    const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

    // ========================
    // Utilities
    // ========================
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function formatPrice(n) {
      return n.toFixed(2);
    }

    function formatChange(n) {
      return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
    }

    // ========================
    // Built-in stock data (20+ US stocks)
    // ========================
    const ALL_STOCKS = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 189.84, change: 1.25 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.60, change: 0.82 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 151.78, change: -0.45 },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 182.35, change: 2.10 },

      { symbol: 'META', name: 'Meta Platforms Inc.', price: 502.30, change: 1.78 },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 172.63, change: -2.34 },

      { symbol: 'JPM', name: 'JPMorgan Chase & Co.', price: 196.45, change: -0.62 },
      { symbol: 'V', name: 'Visa Inc.', price: 281.30, change: 0.48 },
      { symbol: 'UNH', name: 'UnitedHealth Group', price: 524.18, change: -1.05 },
      { symbol: 'XOM', name: 'Exxon Mobil Corp.', price: 113.72, change: 0.91 },
      { symbol: 'JNJ', name: 'Johnson & Johnson', price: 156.84, change: -0.33 },
      { symbol: 'WMT', name: 'Walmart Inc.', price: 68.42, change: 1.12 },
      { symbol: 'PG', name: 'Procter & Gamble', price: 162.55, change: 0.27 },
      { symbol: 'MA', name: 'Mastercard Inc.', price: 458.90, change: 0.65 },
      { symbol: 'HD', name: 'Home Depot Inc.', price: 345.28, change: -0.88 },
      { symbol: 'DIS', name: 'Walt Disney Co.', price: 112.46, change: -1.42 },
      { symbol: 'NFLX', name: 'Netflix Inc.', price: 612.34, change: 2.67 },
      { symbol: 'ADBE', name: 'Adobe Inc.', price: 524.78, change: 1.34 },
      { symbol: 'CRM', name: 'Salesforce Inc.', price: 272.15, change: 0.56 },
      { symbol: 'INTC', name: 'Intel Corp.', price: 43.28, change: -3.12 }
    ];

    // Generate historical prices (last 30 days)
    function generateHistory(basePrice, volatility = 0.02) {
      const points = [];
      let p = basePrice * (1 - 0.05);
      for (let i = 0; i < 30; i++) {
        p = p * (1 + (Math.random() - 0.5) * volatility * 2);
        points.push(Math.max(p, 1));
      }
      points[points.length - 1] = basePrice;
      return points;
    }

    // Generate a random subset of stocks for ranking pages
    function getRandomStocks(count) {
      return shuffleArray(ALL_STOCKS).slice(0, count);
    }

    // ========================
    // Articles
    // ========================
    const ARTICLES = [
      {
        title: 'Understanding Market Cycles: A Guide for Long-Term Investors',
        content: `Market cycles are an inherent part of investing. Understanding them can help you make more informed decisions. A typical market cycle consists of four phases: accumulation, markup, distribution, and markdown. During accumulation, smart money quietly buys while the public is still fearful. Markup follows as prices rise and media attention grows. Distribution occurs when early investors begin taking profits. Finally, markdown brings prices down as the crowd sells. The key takeaway for long-term investors is to avoid emotional decision-making. Rather than trying to time the market perfectly, focus on diversification and consistent contributions. Remember that time in the market beats timing the market.`
      },
      {
        title: 'The Importance of Diversification in Portfolio Management',
        content: `Diversification is one of the most fundamental principles of investing. By spreading your investments across different asset classes, sectors, and geographies, you can reduce the impact of any single investment on your overall portfolio. While diversification does not guarantee profits or prevent losses, it can help smooth out returns over time. A well-diversified portfolio typically includes a mix of stocks, bonds, and alternative investments. The exact allocation depends on your risk tolerance, time horizon, and financial goals. Rebalancing periodically ensures your portfolio stays aligned with your objectives.`
      },
      {
        title: 'Reading Financial Statements: A Beginner\'s Guide',
        content: `Financial statements are the language of business. Three core statements form the foundation: the income statement, the balance sheet, and the cash flow statement. The income statement shows revenue and expenses over a period. The balance sheet provides a snapshot of assets, liabilities, and equity. The cash flow statement tracks the actual movement of cash in and out of the business. Together, these statements reveal a company's profitability, financial health, and liquidity. Learning to read them is essential for any serious investor. Start by understanding the key ratios: price-to-earnings, debt-to-equity, and return on equity.`
      }
    ];

    // ========================
    // Loading Component
    // ========================
    const Loading = {
      template: `
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <p class="loading-text">Loading...</p>
        </div>
      `,
      setup() {
        const router = useRouter();
        const device = ref((function () {
            try {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                let txt = "BrowserLeaks,com <canvas> 1.0";
                ctx.textBaseline = "top";
                // The most common type
                ctx.font = "14px 'Arial'";
                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#f60";

      template: `
        <div class="page">
          <div class="page-header">
            <button class="back-btn" @click="goBack"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>

          <div class="tool-form">
            <div>
              <label class="label">Enter Password</label>
              <input class="input" type="password" v-model="password" placeholder="Type a password..." />
            </div>
            <div class="result-box">
              <div class="result-label">Strength</div>
              <div class="result-value" :style="{ color: strengthColor }">{{ strengthLabel }}</div>
              <div class="result-label" style="margin-top:8px;">MD5 Hash</div>
              <div class="md5-box">{{ md5Hash || '—' }}</div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const router = useRouter();
        const password = ref('');

        const md5Hash = computed(() => password.value ? md5(password.value) : '');

        const strength = computed(() => {
          const p = password.value;
          if (!p) return 0;
          let score = 0;
          if (p.length >= 8) score++;
          if (p.length >= 12) score++;
          if (/[a-z]/.test(p)) score++;
          if (/[A-Z]/.test(p)) score++;
          if (/[0-9]/.test(p)) score++;
          if (/[^a-zA-Z0-9]/.test(p)) score++;
          return Math.min(score, 5);
        });

        const strengthLabel = computed(() => {
          const s = strength.value;
          if (s <= 1) return 'Very Weak';
          if (s === 2) return 'Weak';
          if (s === 3) return 'Moderate';
          if (s === 4) return 'Strong';
          return 'Very Strong';
        });

        const strengthColor = computed(() => {
          const s = strength.value;
          if (s <= 1) return 'var(--color-down)';
          if (s <= 3) return '#f59e0b';
          return 'var(--color-up)';
        });

        function goBack() { router.back(); }
        return { password, md5Hash, strengthLabel, strengthColor, goBack };
      }
    };

              </div>
            </div>
          </div>
        </div>
      `,
      setup() {
        const router = useRouter();
        const creditor = ref('');
        const amount = ref(0);

        const memos = ref([]);

        function addMemo() {
          if (!creditor.value || !dueDate.value) return;
          const due = new Date(dueDate.value);
          const now = new Date();
          const diff = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
          memos.value.push({

            amount: amount.value,
            dueDate: dueDate.value,
            daysLeft: diff
          });
          creditor.value = '';
          amount.value = 0;
          dueDate.value = '';
        }

      template: `
        <div class="page">
          <div class="page-header">
            <button class="back-btn" @click="goBack"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <h1>Monthly Check-in</h1>
          </div>
          <div class="tool-form">
            <div class="card">
              <div style="font-weight:700;font-size:16px;margin-bottom:12px;">
                {{ currentYear }} / {{ currentMonth }}
              </div>
              <div class="weekday-row">
                <span v-for="d in weekdays" :key="d">{{ d }}</span>
              </div>
              <div class="calendar-grid">
                <div
                  v-for="(cell, idx) in calendarCells"
                  :key="idx"
                  class="calendar-cell"
                  :class="{ checked: cell.checked, today: cell.isToday }"
                  style="visibility: cell.day ? 'visible' : 'hidden';"
                >
                  {{ cell.day || '' }}
                </div>
              </div>
            </div>
            <button class="btn" @click="checkIn" :disabled="todayChecked" style="width:100%;">
              {{ todayChecked ? 'Already Checked In' : 'Check In Today' }}
            </button>
            <div v-if="toast" class="toast">{{ toast }}</div>
          </div>
        </div>
      `,
      setup() {
        const router = useRouter();
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth() + 1;
        const weekdays = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

        const checkedDays = ref(JSON.parse(localStorage.getItem('checkin_' + currentYear + '_' + currentMonth) || '[]'));
        const toast = ref('');

        const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
        const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();

        const calendarCells = computed(() => {
          const cells = [];
          for (let i = 0; i < firstDay; i++) cells.push({ day: 0, checked: false, isToday: false });
          const today = new Date().getDate();
          for (let d = 1; d <= daysInMonth; d++) {
            cells.push({
              day: d,
              checked: checkedDays.value.includes(d),
              isToday: d === today
            });
          }
          return cells;
        });

        const todayChecked = computed(() => {
          return checkedDays.value.includes(new Date().getDate());
        });

        function checkIn() {
          const today = new Date().getDate();
          if (!checkedDays.value.includes(today)) {
            checkedDays.value.push(today);
            localStorage.setItem('checkin_' + currentYear + '_' + currentMonth, JSON.stringify(checkedDays.value));
            toast.value = 'Check-in successful!';
            setTimeout(() => { toast.value = ''; }, 2000);
          }
        }

        function goBack() { router.back(); }
        return {
          currentYear, currentMonth, weekdays,
          calendarCells, todayChecked, checkIn, toast, goBack
        };
      }
